Macro:OX Offset X by value (abs/rel)
  fvar oxOffs;

  if (input("Offset X by value", "offset:", oxOffs)) {
    oxOffs = oxOffs / UnitScaling;

    if (ModeXRelative > 0) {
      OffsetX = OffsetX + oxOffs;
    }
    else {
      ShdwOffs0 = ShdwOffs0 + oxOffs;
    }
  }
:EndM
; ---------------------------------------
Macro:OY Offset Y by value (abs/rel)
  fvar oyOffs;

  if (input("Offset Y by value", "offset:", oyOffs)) {
    oyOffs = oyOffs / UnitScaling;

    if (ModeYRelative > 0) {
      OffsetY = OffsetY + oyOffs;
    }
    else {
      ShdwOffs1 = ShdwOffs1 + oyOffs;
    }
  }
:EndM
; ---------------------------------------
Macro:PX Preset X (abs/rel)
  fvar px;

  if (input("Preset X with value", "value:", px)) {
    execmacro("internalZX");  // makes calucation easier

    px = px / UnitScaling;
    if (ModeXRelative > 0) {
      OffsetX = OffsetX + px;
    }
    else {
      ShdwOffs0 = ShdwOffs0 + px;
    }
  }
:EndM
; ---------------------------------------
Macro:PY Preset Y (abs/rel)
