; ---------------------------------------
Macro:internalPShandler
  Disp1 = Disp1 - PSoffsX;
  Disp2 = Disp2 - PSoffsY;
:EndM
; ---------------------------------------
Macro:PS Point-sequence along X, Y
  fvar PSincrX, PSincrY;
  fvar PSoffsX, PSoffsY;
  
  if (input("Point sequence",
            "Inc. along X: ", PSincrX,
            "Inc. along Y: ", PSincrY)) {

		PSoffsX = Disp1;
		PSoffsY = Disp2;

    display("addPreDispHandler", "internalPShandler");

    while (getnext("move to 0 / 0; <Esc> to break")) {
      PSoffsX = PSoffsX + PSincrX;
			PSoffsY = PSoffsY + PSincrY;
    }

    display("removePreDispHandler", "internalPShandler");
  }
:EndM
