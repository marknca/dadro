Macro:internalHZA
  // hardware-zero all devices
  execmacro("internalDev0CH");
  execmacro("internalDev1CH");
:EndM
; ---------------------------------------
Macro:internalFTA
  // switches all devices to FT-mode
  execmacro("internalDev0DH");
  execmacro("internalDev0CH");

  execmacro("internalDev1DH");
  execmacro("internalDev1CH");
:EndM
; ---------------------------------------
Macro:internalZX
  if (ModeXRelative > 0) {
    OffsetX = OffsetX - Disp1;
  }
  else {
    ShdwOffs0 = - Dev0 * Dev0Scaling / UnitScaling;
  }
:EndM
; ---------------------------------------
Macro:internalZY
  if (ModeYRelative > 0) {
    OffsetY = OffsetY - Disp2;
  }
  else {
    ShdwOffs1 = - Dev1 * Dev1Scaling / UnitScaling;
  }
:EndM
; ---------------------------------------
Macro:internalForcedConfig
  fvar EFDiameter, EFDiameterSmall;
  fvar TGSnap, temp1;

  persread(EFDiameter,         "EdgeFinderDiameterNormal");
  persread(EFDiameterSmall,    "EdgeFinderDiameterSmall");
  persread(TGSnap,             "ToolGeometrySnapMetric");
  persread(temp1,              "ToolGeometrySnapInch");

  if (input("Configuration",
	     "edge finder diameter (normal):", EFDiameter,
	     "edge finder diameter (small) :", EFDiameterSmall,
	     "AVG-buffer threshold (metric):", AVGThresholdMetric,
	     "AVG-buffer threshold (inch)  :", AVGThresholdInch,
	     "Tool geometry snap   (metric):", TGSnap,
	     "Tool geometry snap   (inch)  :", temp1)) {

    perswrite(EFDiameter);
    perswrite(EFDiameterSmall);
    perswrite(AVGThresholdMetric);
    perswrite(AVGThresholdInch);
    perswrite(TGSnap);
    perswrite(temp1);
  }
:EndM
; ---------------------------------------
Macro:internalEFDiamNormal
  persread(EFDiameter, "EdgeFinderDiameterNormal");
  if (EFDiameter == 0) {
    execmacro("internalForcedConfig");
  }
:EndM
; ---------------------------------------
Macro:internalEFDiamSmall
  persread(EFDiameter, "EdgeFinderDiameterSmall");
  if (EFDiameter == 0) {
    execmacro("internalForcedConfig");
  }
:EndM
