  if (input("Preset Y with value", "value:", py)) {
    execmacro("internalZY");

    py = py / UnitScaling;
    if (ModeYRelative > 0) {
      OffsetY = OffsetY + py;
    }
    else {
      ShdwOffs1 = ShdwOffs1 + py;
    }
  }
:EndM
; ---------------------------------------
Macro:C2PXY Center w. 2 points XY-plane
  fvar c2pX1, c2pX2, c2pY1, c2pY2;
  fvar c2poox, c2pooy;

  c2pX1 = Disp1;
  c2pY1 = Disp2;
  if (input("2 point center. First point is current position")) {
    if (getnext("Move to 2nd point")) {
      c2pX2 = Disp1;
      c2pY2 = Disp2;

      c2poox = OffsetX;
      c2pooy = OffsetY;
      execmacro("internalStatusAbsSave");
      execmacro("internalStatusRelX");
      execmacro("internalStatusRelY");

      OffsetX = (OffsetX - (c2pX1 + (c2pX2 - c2pX1) / 2)) / UnitScaling;
      OffsetY = (OffsetY - (c2pY1 + (c2pY2 - c2pY1) / 2)) / UnitScaling;

      getnext("move to X/Y = 0.0 for center");
      OffsetX = c2poox;
      OffsetY = c2pooy;

      execmacro("internalStatusAbsRestore");
    }
  }
:EndM
; ---------------------------------------
Macro:-X Change sign X
  SignX = -SignX;

  if (SignX < 0) {
    display("Status", 1, 3, "NEG");
  }
  else {
    display("Status", 1, 3, "");
  }
:Endm
; ---------------------------------------
Macro:-Y Change sign Y
  SignY = - SignY;

  if (SignY < 0) {
    display("Status", 2, 3, "NEG");
  }
  else {
    display("Status", 2, 3, "");
  }
:Endm
; ---------------------------------------
; ***************************************
; *** Tool Geometry                   ***
; ***************************************
Macro:internalTGHandler

  // ---- detect change of units
  if (TGUnitScaling != UnitScaling) {
    input("Can't change units while TGC is active! Switching unit back.");
    if (TGUnitScaling == 1) {
      execmacro("internalMetric");
    }
    else {
      execmacro("internalInch");
    }
  }

  // ---- X-axis
  if (Disp1 - TGXYLast1 >= TGSnap) {  // moving in pos. direction
    TGXYLast1 = Disp1;
    TGXYMoveX = TGR;
    display("Status", 1, 5, "TGC +");
  }

  if (TGXYLast1 - Disp1 >= TGSnap) {   // moving in neg. direction
    TGXYLast1 = Disp1;
    TGXYMoveX = - TGR;
    display("Status", 1, 5, "TGC -");
  }

  // ---- Y-axis
  if (Disp2 - TGXYLast2 >= TGSnap) {  // moving in pos. direction
    TGXYLast2 = Disp2;
    TGXYMoveY = TGR;
    display("Status", 2, 5, "TGC +");
  }

  if (TGXYLast2 - Disp2 >= TGSnap) {   // moving in neg. direction
    TGXYLast2 = Disp2;
    TGXYMoveY = - TGR;
    display("Status", 2, 5, "TGC -");
  }

  Disp1 = Disp1 + TGXYMoveX / UnitScaling;
  Disp2 = Disp2 + TGXYMoveY / UnitScaling;
:Endm
; ---------------------------------------
Macro:internalToolGeometryReadSnap
  if (intStatusUnit == 0) { // metric
    persread(TGSnap, "ToolGeometrySnapMetric");
  }
  else {
    persread(TGSnap, "ToolGeometrySnapInch");
  }
:EndM
; ---------------------------------------
Macro:internalToolGeometryGetSnap
  execmacro("internalToolGeometryReadSnap");

  while (TGSnap <= 0) {
    input("Tool geometry snap must be > 0.0");
    execmacro("internalForcedConfig");
  
    execmacro("internalToolGeometryReadSnap");
  }
:EndM
; ---------------------------------------
Macro:internalToolGeometry
  fvar TGXYLast1, TGXYLast2;
  fvar TGXYMoveX, TGXYMoveY;
  fvar TGSnap;
  fvar TGUnitScaling;


  TGUnitScaling = UnitScaling; // detect change of units while TGC is active

  execmacro("internalToolGeometryGetSnap");

  // remove if it was already running (is still running)
  display("removePreDispHandler", "internalTGHandler");

  // ---- if we change tools, the Disp1/Disp2 still has the offset.
  //      We need to substract it
  TGXYLast1 = Disp1 - TGXYMoveX / UnitScaling;
  TGXYLast2 = Disp2 - TGXYMoveY / UnitScaling;

  TGXYMoveX = 0; // need to reinit
  TGXYMoveY = 0;
  display("Status", 1, 5, "TGC ?"); // show that snap has not yet detected
  display("Status", 2, 5, "TGC ?"); // the side we are cutting at

  display("addPreDispHandler", "internalTGHandler");
:Endm
; ---------------------------------------
Macro:TGC Tool Geometry Correction
  fvar TGR, TGZ, TGSnap;

  TGR = TGR * 2;  // Radius vs. Diameter

  execmacro("internalToolGeometryGetSnap");

  if (input("Tool Geometry Correction",
		      "Mill diameter:", TGR,
			   "Z-offset:", TGZ,
			 "Snap-value:", TGSnap)) {

    perswrite(TGSnap);  // write back, it might be reread in internalToolGeometry
    execmacro("internalToolGeometry");
  }

  TGR = TGR / 2;  // Radius vs. Diameter
:Endm
; ---------------------------------------
Macro:internalTGOFF
  display("removePreDispHandler", "internalTGHandler");

  TGXYMoveX = 0;
  TGXYMoveY = 0;

  display("Status", 1, 5, "");
  display("Status", 2, 5, "");

:EndM
; ---------------------------------------
Macro:TGC- Switch off Tool Geometry correction
  execmacro("internalTGOFF");
:Endm
; ---------------------------------------
; ***********************************************************************
; *** Setup/Configuration of YADRO                                    ***
; ***********************************************************************
Interp:
  fvar Dev0ScalingMetric, Dev0ScalingInch;
  fvar Dev1ScalingMetric, Dev1ScalingInch;

  fvar PrecisionMetric, PrecisionInch;
  fvar OffsetX, OffsetY;
  fvar ShdwOffs0, ShdwOffs1;
  fvar SignX, SignY;
  fvar Dev0Scaling, Dev1Scaling;
  fvar UnitScaling;

:endI
; the following file mscaling.inc is generated by the setup-program
INCLUDE:mscaling.inc
Interp:
  PrecisionMetric = 2;  // resolution is 0.01mm
  PrecisionInch = 3;    // resolution is 0.001"

  SignX = 1;
  SignY = 1;
  UnitScaling = 1;

  display("AxName", 1, "X");
  display("AxName", 2, "Y");
  display("AxSecName", 1, "X (abs)");
  display("AxSecName", 2, "Y (abs)");

  persread(intStatusUnit, "lastUnitSelection");
  persread(AVGThresholdMetric, "AVGFilterThresholdMetric");
  if (AVGThresholdMetric == 0) {
    AVGThresholdMetric = 0.02;
    perswrite(AVGThresholdMetric);
  }

  persread(AVGThresholdInch,   "AVGFilterThresholdInch");
  if (AVGThresholdInch == 0) {
    AVGThresholdInch = 0.005;
    perswrite(AVGThresholdInch);
  }

  if (intStatusUnit == 0) {
    execmacro("internalMetric"); // switch to metric and config AVG-buffer
  }
  else {
    execmacro("internalInch");
  }

  display("Source", 1, "(Dev0 * Dev0Scaling + (ShdwOffs0 + OffsetX * ModeXRelative) * UnitScaling) * SignX");
  display("Source", 2, "(Dev1 * Dev1Scaling + (ShdwOffs1 + OffsetY * ModeYRelative) * UnitScaling) * SignY");

  display("SecSource", 1, "Dev0 * Dev0Scaling + ShdwOffs0 * UnitScaling");
  display("SecSource", 2, "Dev1 * Dev1Scaling + ShdwOffs1 * UnitScaling");

  execmacro("internalStatusAbsX");
  execmacro("internalStatusAbsY");


  if (input("Initialize Devices?")) {
    if (input("Hardware-Zero devices?")) {
      execmacro("internalHZA");
    }
    if (input("Switch to FT-Mode?")) {
      execmacro("internalFTA");
    }
  }
:endI


