Macro:C2PXY Center w. 2 points XY-plane
  fvar c2pX1, c2pX2, c2pY1, c2pY2;
  fvar c2poox, c2pooy;

  c2pX1 = Disp1;
  c2pY1 = Disp2;
  if (input("2 point center. First point is current position")) {
    if (getnext("Move to 2nd point")) {
      c2pX2 = Disp1;
      c2pY2 = Disp2;

      c2poox = OffsetX;
      c2pooy = OffsetY;
      execmacro("internalStatusAbsSave");
      execmacro("internalStatusRelX");
      execmacro("internalStatusRelY");

      OffsetX = (OffsetX - (c2pX1 + (c2pX2 - c2pX1) / 2)) / UnitScaling;
      OffsetY = (OffsetY - (c2pY1 + (c2pY2 - c2pY1) / 2)) / UnitScaling;

      getnext("move to X/Y = 0.0 for center");
      OffsetX = c2poox;
      OffsetY = c2pooy;

      execmacro("internalStatusAbsRestore");
    }
  }
:EndM
