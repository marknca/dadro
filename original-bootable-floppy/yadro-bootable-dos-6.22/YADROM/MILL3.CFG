Macro:internalForcedConfig
  fvar EFDiameter, EFDiameterSmall;
  fvar TGSnap, temp1;

  persread(EFDiameter,         "EdgeFinderDiameterNormal");
  persread(EFDiameterSmall,    "EdgeFinderDiameterSmall");
  persread(TGSnap,             "ToolGeometrySnapMetric");
  persread(temp1,              "ToolGeometrySnapInch");

  if (input("Configuration",
	     "edge finder diameter (normal):", EFDiameter,
	     "edge finder diameter (small) :", EFDiameterSmall,
	     "AVG-buffer threshold (metric):", AVGThresholdMetric,
	     "AVG-buffer threshold (inch)  :", AVGThresholdInch,
	     "Tool geometry snap   (metric):", TGSnap,
	     "Tool geometry snap   (inch)  :", temp1)) {

    perswrite(EFDiameter);
    perswrite(EFDiameterSmall);
    perswrite(AVGThresholdMetric);
    perswrite(AVGThresholdInch);
    perswrite(TGSnap);
    perswrite(temp1);
  }
:EndM
