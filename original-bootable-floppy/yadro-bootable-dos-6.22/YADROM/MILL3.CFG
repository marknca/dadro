Macro:internalCLHfix360CLTemp
  // adjusts CLTemp to be within 0..360

  while (CLTemp < 0) {
    CLTemp = CLTemp + 360;
  }

  while (CLTemp >= 360) {
    CLTemp = CLTemp - 360;
  }
:Endm
; ---------------------------------------
Macro:CLH Cam Lobe (harmonic) (RT along X-axis, Z along lift axis)
  // For more about the theory of cams in general and the
  // harmonic lobe used here read:
  // "Die Steuerung des Gaswechsels in schnellaufenden Verbrennungsmotoren"
  // by W-D Bensinger
  // Springer Verlag 1968

  fvar CLTipRadius, CLBaseRadius, CLLift, CLTiming, CLOffs;
  fvar CLa, CLStep, CLAngle, CLThetaTip, CLTemp, CLRho, CLZ, CLOffsZSave;

  // I have preset the values for my testing.
  // Read the following 4 lines or use as guidance
  // CLTipRadius = 0.75;
  // CLBaseRadius = 6.5;
  // CLLift = 3;
  // CLTiming = 100;
  CLStep = 2;

  if (input("Cam Lobe",
	 "Tip Radius:", CLTipRadius,
	"Base Radius:", CLBaseRadius,
	       "Lift:", CLLift,
       "Timing Angle:", CLTiming,
       "Angular step:", CLStep,
   "Offset (angular):", CLOffs)) {

    // ---- do pre-calcs
    CLTiming = CLTiming / 2;
    CLa = CLBaseRadius + CLLift - CLTipRadius;
    CLAngle = 0;     // current angle in lobe (adding offset)

    CLRho = (sqr(CLa) + sqr(CLBaseRadius) - sqr(CLTipRadius) - 2 * CLa *
	    CLBaseRadius * cos(CLTiming)) /
	    (2 * (CLBaseRadius - CLTipRadius - CLa * cos(CLTiming)));
    CLTemp = CLa * sin(CLTiming) / (CLRho - CLTipRadius);
    CLTemp = asin(CLTemp);
    CLThetaTip = CLTiming - CLTemp;

    input("Calculated Value. Do not change!", "Chest radius (must be positive):", CLRho);

    // we start milling on the tip
    getnext("move face of mill to outer circle (base circle + lift)");

    CLOffsZSave = OffsetZ;
    OffsetZ = OffsetZ - Disp3 - CLLift;
    CLZ = OffsetZ;  // remeber OffsetZ, we work relative to it

    while (CLAngle < 360) {
      if (CLAngle < 180) {
	// ---- chest circle
	CLTemp = (CLRho - CLBaseRadius) * (1 - cos(CLTiming - CLAngle));

	// ---- tip circle, will override chest circle
	if (CLAngle <= CLThetaTip) {
	  CLTemp = CLLift - CLa * (1 - cos(CLAngle));
	}

	// base circle
	if (CLAngle >= CLTiming) {
	  CLTemp = CLTiming + CLOffs;
	  OffsetZ = CLZ;
	  // we mill the base circle in one pass. No need for stepping trough
	  execmacro("internalCLHfix360CLTemp");
	  getnext("base circle: Move Z to: 0.0 ", " rotate RT to:", CLTemp);

	  CLAngle = 360 - CLTiming;
	  CLTemp = CLAngle + CLOffs;
	  execmacro("internalCLHfix360CLTemp");

	  getnext("base circle:", " Keep Z, rotate RT to:", CLTemp);
	}
	else {
	  OffsetZ = CLZ + CLTemp;
	  CLTemp = CLAngle + CLOffs;

	  execmacro("internalCLHfix360CLTemp");
	  if (!getnext("facett:", " Move Z to 0.0, rotate RT to:", CLTemp)) {
	    break;
	  };
	}

      } // if < 180 deg
      else {  // mirrored part
	// ---- chest circle
	CLTemp = (CLRho - CLBaseRadius) * (1 - cos(360 - CLTiming - CLAngle));

	// ---- tip circle, will override chest circle
	if (CLAngle >= 360 - CLThetaTip) {
	  CLTemp = CLLift - CLa * (1 - cos(360 - CLAngle));
	}

	OffsetZ = CLZ + CLTemp;
	CLTemp = CLAngle + CLOffs;

	execmacro("internalCLHfix360CLTemp");
	if (!getnext("facett:", " Move Z to 0.0, rotate RT to:", CLTemp)) {
	  break;
	};
      }  // mirrored

      CLAngle = CLAngle + CLStep;
    }  // while

    OffsetZ = CLOffsZSave;
  } // if input
:Endm
;----------------------------------------
; ***********************************************************************
; *** Setup/Configuration of YADRO                                    ***
; ***********************************************************************
Interp:
  fvar Dev0ScalingMetric, Dev0ScalingInch;
  fvar Dev1ScalingMetric, Dev1ScalingInch;
  fvar Dev2ScalingMetric, Dev2ScalingInch;

  fvar PrecisionMetric, PrecisionInch;
  fvar OffsetX, OffsetY, OffsetZ;
  fvar ShdwOffs0, ShdwOffs1, ShdwOffs2;
  fvar SignX, SignY, SignZ;
  fvar Dev0Scaling, Dev1Scaling, Dev2Scaling;
  fvar UnitScaling;

:endI
; the following file mscaling.inc is generated by the setup-program
INCLUDE:mscaling.inc
Interp:
  PrecisionMetric = 2;  // resolution is 0.01mm
  PrecisionInch = 3;    // resolution is 0.001"

  SignX = 1;
  SignY = 1;
  SignZ = 1;
  UnitScaling = 1;

  display("AxName", 1, "X");
  display("AxName", 2, "Y");
  display("AxName", 3, "Z");
  display("AxSecName", 1, "X (abs)");
  display("AxSecName", 2, "Y (abs)");
  display("AxSecName", 3, "Z (abs)");

  persread(intStatusUnit, "lastUnitSelection");
  persread(AVGThresholdMetric, "AVGFilterThresholdMetric");
  if (AVGThresholdMetric == 0) {
    AVGThresholdMetric = 0.02;
    perswrite(AVGThresholdMetric);
  }

  persread(AVGThresholdInch,   "AVGFilterThresholdInch");
  if (AVGThresholdInch == 0) {
    AVGThresholdInch = 0.005;
    perswrite(AVGThresholdInch);
  }

  if (intStatusUnit == 0) {
    execmacro("internalMetric"); // switch to metric and config AVG-buffer
  }
  else {
    execmacro("internalInch");
  }

  display("Source", 1, "(Dev0 * Dev0Scaling + (ShdwOffs0 + OffsetX * ModeXRelative) * UnitScaling) * SignX");
  display("Source", 2, "(Dev1 * Dev1Scaling + (ShdwOffs1 + OffsetY * ModeYRelative) * UnitScaling) * SignY");
  display("Source", 3, "(Dev2 * Dev2Scaling + (ShdwOffs2 + OffsetZ * ModeZRelative) * UnitScaling) * SignZ");

  display("SecSource", 1, "Dev0 * Dev0Scaling + ShdwOffs0 * UnitScaling");
  display("SecSource", 2, "Dev1 * Dev1Scaling + ShdwOffs1 * UnitScaling");
  display("SecSource", 3, "Dev2 * Dev2Scaling + ShdwOffs2 * UnitScaling");

  execmacro("internalStatusAbsX");
  execmacro("internalStatusAbsY");
  execmacro("internalStatusAbsZ");


  if (input("Initialize Devices?")) {
    if (input("Hardware-Zero devices?")) {
      execmacro("internalHZA");
    }
    if (input("Switch to FT-Mode?")) {
      execmacro("internalFTA");
    }
  }
:endI


