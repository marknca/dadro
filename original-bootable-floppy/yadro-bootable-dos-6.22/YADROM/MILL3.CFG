; ***************************************
; *** Tool Geometry                   ***
; ***************************************
Macro:internalTGHandler

  // ---- detect change of units
  if (TGUnitScaling != UnitScaling) {
    input("Can't change units while TGC is active! Switching unit back.");
    if (TGUnitScaling == 1) {
      execmacro("internalMetric");
    }
    else {
      execmacro("internalInch");
    }
  }

  // ---- X-axis
  if (Disp1 - TGXYLast1 >= TGSnap) {  // moving in pos. direction
    TGXYLast1 = Disp1;
    TGXYMoveX = TGR;
    display("Status", 1, 5, "TGC +");
  }

  if (TGXYLast1 - Disp1 >= TGSnap) {   // moving in neg. direction
    TGXYLast1 = Disp1;
    TGXYMoveX = - TGR;
    display("Status", 1, 5, "TGC -");
  }

  // ---- Y-axis
  if (Disp2 - TGXYLast2 >= TGSnap) {  // moving in pos. direction
    TGXYLast2 = Disp2;
    TGXYMoveY = TGR;
    display("Status", 2, 5, "TGC +");
  }

  if (TGXYLast2 - Disp2 >= TGSnap) {   // moving in neg. direction
    TGXYLast2 = Disp2;
    TGXYMoveY = - TGR;
    display("Status", 2, 5, "TGC -");
  }

  Disp1 = Disp1 + TGXYMoveX / UnitScaling;
  Disp2 = Disp2 + TGXYMoveY / UnitScaling;
  Disp3 = Disp3 - TGZ;
:Endm
