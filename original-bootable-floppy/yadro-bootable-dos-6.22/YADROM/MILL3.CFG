Macro:internalStatusAbsRestore
  if (intStatusAbsXSave > 0) { execmacro("internalStatusAbsX") }
  else { execmacro("internalStatusRelX") }

  if (intStatusAbsYSave > 0) { execmacro("internalStatusAbsY") }
  else { execmacro("internalStatusRelY") }

  if (intStatusAbsZSave > 0) { execmacro("internalStatusAbsZ") }
  else { execmacro("internalStatusRelZ") }
:EndM
; ---------------------------------------
Macro:internalMetric
  fvar count;

  Dev0Scaling = Dev0ScalingMetric;
  Dev1Scaling = Dev1ScalingMetric;
  Dev2Scaling = Dev2ScalingMetric;
  UnitScaling = 1;
  intStatusUnit = 0;
  perswrite(intStatusUnit);

  count = 1;
  while (count <= 3) {
    display("Status",       count, 1, "mm");
    display("Precision",    count, PrecisionMetric);
    display("SecPrecision", count, PrecisionMetric);
    count = count + 1;
  }

  // we have to adjust the averaging threshold
  display("Average",    "GAT", 15, AVGThresholdMetric);
  display("SecAverage", "GAT", 20, AVGThresholdMetric);
:EndM
; ---------------------------------------
Macro:internalInch
  fvar count;

  Dev0Scaling = Dev0ScalingInch;
  Dev1Scaling = Dev1ScalingInch;
  Dev2Scaling = Dev2ScalingInch;
  UnitScaling = 1 / 25.4;
  intStatusUnit = 1;
  perswrite(intStatusUnit);

  count = 1;
  while (count <= 3) {
    display("Status",       count, 1, "inch");
    display("Precision",    count, PrecisionInch);
    display("SecPrecision", count, PrecisionInch);
    count = count + 1;
  }

  // we have to adjust the averaging threshold
  display("Average",    "GAT", 15, AVGThresholdInch);
  display("SecAverage", "GAT", 20, AVGThresholdInch);
:EndM
