Macro:internalToolGeometryGetSnap
  execmacro("internalToolGeometryReadSnap");

  while (TGSnap <= 0) {
    input("Tool geometry snap must be > 0.0");
    execmacro("internalForcedConfig");
  
    execmacro("internalToolGeometryReadSnap");
  }
:EndM
; ---------------------------------------
Macro:internalToolGeometry
  fvar TGXYLast1, TGXYLast2;
  fvar TGXYMoveX, TGXYMoveY;
  fvar TGSnap;
  fvar TGUnitScaling;


  TGUnitScaling = UnitScaling; // detect change of units while TGC is active

  execmacro("internalToolGeometryGetSnap");

  // remove if it was already running (is still running)
  display("removePreDispHandler", "internalTGHandler");

  // ---- if we change tools, the Disp1/Disp2 still has the offset.
  //      We need to substract it
  TGXYLast1 = Disp1 - TGXYMoveX / UnitScaling;
  TGXYLast2 = Disp2 - TGXYMoveY / UnitScaling;

  TGXYMoveX = 0; // need to reinit
  TGXYMoveY = 0;
  display("Status", 1, 5, "TGC ?"); // show that snap has not yet detected
  display("Status", 2, 5, "TGC ?"); // the side we are cutting at

  display("addPreDispHandler", "internalTGHandler");
:Endm
; ---------------------------------------
Macro:TGC Tool Geometry Correction
  fvar TGR, TGZ, TGSnap;

  TGR = TGR * 2;  // Radius vs. Diameter

  execmacro("internalToolGeometryGetSnap");

  if (input("Tool Geometry Correction",
		      "Mill diameter:", TGR,
			   "Z-offset:", TGZ,
			 "Snap-value:", TGSnap)) {

    perswrite(TGSnap);  // write back, it might be reread in internalToolGeometry
    execmacro("internalToolGeometry");
  }

  TGR = TGR / 2;  // Radius vs. Diameter
:Endm
; ---------------------------------------
Macro:internalTGOFF
  display("removePreDispHandler", "internalTGHandler");

  TGXYMoveX = 0;
  TGXYMoveY = 0;

  display("Status", 1, 5, "");
  display("Status", 2, 5, "");

:EndM
; ---------------------------------------
Macro:TGC- Switch off Tool Geometry correction
  execmacro("internalTGOFF");
:Endm
