Macro:PS Point-sequence along X, Y, Z
  fvar PSincrX, PSincrY, PSincrZ;
  fvar PSoffsX, PSoffsY, PSoffsZ;
  
  if (input("Point sequence",
            "Inc. along X: ", PSincrX,
            "Inc. along Y: ", PSincrY,
            "Inc. along Z: ", PSincrZ)) {

		PSoffsX = Disp1;
		PSoffsY = Disp2;
		PSoffsZ = Disp3;

    display("addPreDispHandler", "internalPShandler");

    while (getnext("move to 0 / 0 / 0; <Esc> to break")) {
      PSoffsX = PSoffsX + PSincrX;
			PSoffsY = PSoffsY + PSincrY;
			PSoffsZ = PSoffsZ + PSincrZ;
    }

    display("removePreDispHandler", "internalPShandler");
  }
:EndM
