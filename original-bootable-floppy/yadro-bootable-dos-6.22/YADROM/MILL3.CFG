Macro:internalToolGeometryReadSnap
  if (intStatusUnit == 0) { // metric
    persread(TGSnap, "ToolGeometrySnapMetric");
  }
  else {
    persread(TGSnap, "ToolGeometrySnapInch");
  }
:EndM
