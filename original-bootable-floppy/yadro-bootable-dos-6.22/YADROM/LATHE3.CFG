; lathe3.cfg
; Version 0.2a
; ************************************************************************
;
;                        YADRO DRO:ddisp
;
;                   Configuration file for a lathe with 3 axes
;
;  Axes naming convention:
;  X : cross slide (diameter) + offset of a swiveled compound
;  Z1: carriage
;  Z2: compound (value along spindle axis)
;  Z : Z1 + Z2
;
;                For more comments, see www.yadro.de
;
; *************************************************************************
; *** The following file "lconnect.inc" is generated by the             ***
; *** setup-program                                                     ***
; *************************************************************************
INCLUDE:lconnect.inc
;
; *************************************************************************
; *** Tool-geometry (mills and their radii with offset                  ***
; *************************************************************************
INCLUDE:l_tools.inc
Interp:
  fvar TGMoveZ, TGLastZ, TGSnap; // if tool geometry correction has not yet been used
:EndI
; *************************************************************************
; *** Internal macros                                                   ***
; *************************************************************************
;
Interp:
  fvar intStatusAbsX, intStatusAbsZ1, intStatusAbsZ2;
  fvar intStatusAbsXSave, intStatusAbsZ1Save, intStatusAbsZ2Save;
  fvar intStatusUnit;                         // metric/inch mode YES/NO?
  fvar AVGThresholdMetric, AVGThresholdInch;

  fvar ModeXRelative, ModeZ1Relative, ModeZ2Relative;
  fvar ZSumActive;  // signals wether Z = Z1 + Z2 or Z1 and Z2 are displayed separate
:EndI
; *** macros
; ---------------------------------------
Macro:internalStatusAbsX
  intStatusAbsX = 1;
  ModeXRelative = 0;

  display("Status", 1, 2, "abs");
:EndM
; ---------------------------------------
Macro:internalStatusAbsZ1
  if (ZSumActive > 0) {
    ZSumActive = 0; // avoid recursion
    execmacro("internalStatusAbsZ2");
    ZSumActive = 1;
  }

  intStatusAbsZ1 = 1;
  ModeZ1Relative = 0;

  display("Status", 2, 2, "abs");
:EndM
; ---------------------------------------
Macro:internalStatusAbsZ2
  if (ZSumActive > 0) {
    ZSumActive = 0; // avoid recursion
    execmacro("internalStatusAbsZ1");
    ZSumActive = 1;
  }

  intStatusAbsZ2 = 1;
  ModeZ2Relative = 0;

  display("Status", 3, 2, "abs");
:EndM
; ---------------------------------------
Macro:internalStatusRelX
  intStatusAbsX = -1;
  ModeXRelative = 1;

  display("Status", 1, 2, "rel");
:EndM
; ---------------------------------------
Macro:internalStatusRelZ1
  if (ZSumActive > 0) {
    ZSumActive = 0; // avoid recursion
    execmacro("internalStatusRelZ2");
    ZSumActive = 1.0;
  }
  intStatusAbsZ1 = -1;
  ModeZ1Relative = 1;

  display("Status", 2, 2, "rel");
:EndM
; ---------------------------------------
Macro:internalStatusRelZ2
  if (ZSumActive > 0) {
    ZSumActive = 0; // avoid recursion
    execmacro("internalStatusRelZ1");
    ZSumActive = 1.0;
  }

  intStatusAbsZ2 = -1;
  ModeZ2Relative = 1;

  display("Status", 3, 2, "rel");
:EndM
; ---------------------------------------
Macro:internalStatusAbsSave
  intStatusAbsXSave  = intStatusAbsX;
  intStatusAbsZ1Save = intStatusAbsZ1;
  intStatusAbsZ2Save = intStatusAbsZ2;
:EndM
; ---------------------------------------
Macro:internalStatusAbsRestore
  if (intStatusAbsXSave > 0) { execmacro("internalStatusAbsX") }
  else { execmacro("internalStatusRelX") }

  if (intStatusAbsZ1Save > 0) { execmacro("internalStatusAbsZ1") }
  else { execmacro("internalStatusRelZ1") }

  if (intStatusAbsZ2Save > 0) { execmacro("internalStatusAbsZ2") }
  else { execmacro("internalStatusRelZ2") }
:EndM
; ---------------------------------------
Macro:internalMetric
  fvar count;

  Dev0Scaling = Dev0ScalingMetric;
  Dev1Scaling = Dev1ScalingMetric;
  Dev2Scaling = Dev2ScalingMetric;
  UnitScaling = 1;
  intStatusUnit = 0;
  perswrite(intStatusUnit);

  count = 1;
  while (count <= 3) {
    display("Status",       count, 1, "mm");
    display("Precision",    count, PrecisionMetric);
    display("SecPrecision", count, PrecisionMetric);
    count = count + 1;
  }

  // we have to adjust the averaging threshold
  display("Average",    "GAT", 15, AVGThresholdMetric);
  display("SecAverage", "GAT", 20, AVGThresholdMetric);
:EndM
; ---------------------------------------
Macro:internalInch
  fvar count;

  Dev0Scaling = Dev0ScalingInch;
  Dev1Scaling = Dev1ScalingInch;
  Dev2Scaling = Dev2ScalingInch;
  UnitScaling = 1 / 25.4;
  intStatusUnit = 1;
  perswrite(intStatusUnit);

  count = 1;
  while (count <= 3) {
    display("Status",       count, 1, "inch");
    display("Precision",    count, PrecisionInch);
    display("SecPrecision", count, PrecisionInch);
    count = count + 1;
  }

  // we have to adjust the averaging threshold
  display("Average",    "GAT", 15, AVGThresholdInch);
  display("SecAverage", "GAT", 20, AVGThresholdInch);
:EndM
; ---------------------------------------
Macro:internalDiameter
  DiamRadius = 2.0;
  perswrite(DiamRadius);
  display("AxName", 1, "/O");
:EndM
; ---------------------------------------
Macro:internalRadius
  DiamRadius = 1.0;
  perswrite(DiamRadius);
  display("AxName", 1, "X");
:EndM
; ---------------------------------------
Macro:internalZ
  ZSumActive = 1.0;
  perswrite(ZSumActive);
  display("AxName", 2, "Z");
:EndM
; ---------------------------------------
Macro:internalZ1
  ZSumActive = 0.0;
  perswrite(ZSumActive);
  display("AxName", 2, "Z/1");
:EndM
; ---------------------------------------
; ***************************************************************************
; *** The following file "lportmap.inc" is generated by the setup program ***
; ***************************************************************************
INCLUDE:lportmap.inc
; ---------------------------------------
Macro:internalHZA
  // hardware-zero all devices
  execmacro("internalDev0CH");
  execmacro("internalDev1CH");
  execmacro("internalDev2CH");
:EndM
; ---------------------------------------
Macro:internalFTA
  // switches all devices to FT-mode
  execmacro("internalDev0DH");
  execmacro("internalDev0CH");

  execmacro("internalDev1DH");
  execmacro("internalDev1CH");

  execmacro("internalDev2DH");
  execmacro("internalDev2CH");
:EndM
; ---------------------------------------
Macro:internalZX
  if (ModeXRelative > 0) {
    OffsetX = OffsetX - (Disp1 / DiamRadius) / UnitScaling;
  }
  else {
    ShdwOffs0 = - Dev0 * Dev0Scaling / UnitScaling - TGX;
  }
:EndM
; ---------------------------------------
Macro:internalZZ1

  if (ZSumActive > 0) {
    // if tool geometry correction is active, ZSum is active
    // tool correction needs to know in which direction it is cutting, so we preset TGLastZ
    // with a big enough value
    if (TGMoveZ > 0) {
      TGLastZ = -9999999999;
    }
    else {
      TGLastZ = 99999999;
    }

    if (ModeZ1Relative > 0) {
      OffsetZ1 = OffsetZ1 - Disp2 / UnitScaling;
    }
    else {
      ShdwOffs1 = - Dev1 * Dev1Scaling / UnitScaling - Disp3 + TGZ - TGMoveZ;
    }
  }
  else {
    if (ModeZ1Relative > 0) {
      OffsetZ1 = OffsetZ1 - Disp2 / UnitScaling;
    }
    else {
      ShdwOffs1 = - Dev1 * Dev1Scaling / UnitScaling - TGZ - TGMoveZ;
    }
  }
:EndM
; ---------------------------------------
Macro:internalZZ2
  if (ZSumActive > 0) {
    if (TGMoveZ > 0) {
      TGLastZ = -9999999999;
    }
    else {
      TGLastZ = 99999999;
    }
  }

  if (ModeZ2Relative > 0) {
    OffsetZ2 = OffsetZ2 - Disp3 / UnitScaling;
  }
  else {
    ShdwOffs2 = - Dev2 * Dev2Scaling / UnitScaling;
  }
:EndM
; ---------------------------------------
Macro:internalForcedConfig
  fvar TGSnap, temp1;

  persread(TGSnap, "ToolGeometrySnapMetric");
  persread(temp1,  "ToolGeometrySnapInch");

  if (input("Configuration",
	     "AVG-buffer threshold (metric):", AVGThresholdMetric,
	     "AVG-buffer threshold (inch)  :", AVGThresholdInch,
	     "Tool geometry snap   (metric):", TGSnap,
	     "Tool geometry snap   (inch)  :", temp1)) {

    perswrite(AVGThresholdMetric);
    perswrite(AVGThresholdInch);
    perswrite(TGSnap);
    perswrite(temp1);
  }
:EndM
; ---------------------------------------
Macro:internalDZS
  execmacro("internalZ");
  display("Source", 2, "(Dev1 * Dev1Scaling + (ShdwOffs1 + OffsetZ1 * ModeZ1Relative) * UnitScaling) * SignZ1 + CompoundZPart");
:EndM
; ---------------------------------------
Macro:internalDZP
  execmacro("internalZ1");
  display("Source", 2, "(Dev1 * Dev1Scaling + (ShdwOffs1 + OffsetZ1 * ModeZ1Relative) * UnitScaling) * SignZ1");
:EndM
; *****************************************************************
; *** user macros                                               ***
; *****************************************************************
;
Macro:{Configuration} AVG-threshold
  execmacro("internalForcedConfig");
:EndM
; ---------------------------------------
Macro:DD Display Diameter
  execmacro("internalDiameter");
:EndM
; ---------------------------------------
Macro:DR Display Radius
  execmacro("internalRadius");
:EndM
; ---------------------------------------
Macro:DZS Display Summ Z1 + Z2
  execmacro("internalDZS");
:EndM
; ---------------------------------------
Macro:DZP Display Parts Z1, Z2
  execmacro("internalDZP");
:EndM
; ---------------------------------------
Macro:Prec+1 Precision +1 digit
  PrecisionMetric = 3;
  PrecisionInch = 4;


  if (intStatusUnit == 0) {
    execmacro("internalMetric");
  }
  else {
    execmacro("internalInch");
  }
:EndM
; ---------------------------------------
Macro:PrecN Precision normal
  PrecisionMetric = 2;
  PrecisionInch = 3;

  if (intStatusUnit == 0) {
    execmacro("internalMetric");
  }
  else {
    execmacro("internalInch");
  }
:EndM
; ---------------------------------------
Macro:SM Metric
  execmacro("internalMetric");
:EndM:BindKey:F1
; ---------------------------------------
Macro:SI Inch
  execmacro("internalInch");
:EndM:BindKey:F2
; ---------------------------------------
Macro:ZX Zero X
  execmacro("internalZX");
:EndM
; ---------------------------------------
Macro:ZZ1 Zero Z1 (or Z if Z = Z1 + Z2)
  execmacro("internalZZ1");
:EndM
; ---------------------------------------
Macro:ZZ2 Zero Z2
  execmacro("internalZZ2");
:EndM
; ---------------------------------------
Macro:ZA Zero all axes (X, Z1, Z2)
  fvar ZATemp;

  execmacro("internalZX");

  if (ZSumActive > 0) {
    ZATemp = Disp3;
    Disp3 = 0;
    execmacro("internalZZ1");
    if (ModeZ1Relative > 0) {
      OffsetZ1 = OffsetZ1 + ZATemp;
    }
    Disp3 = ZATemp;
  }
  else {
    execmacro("internalZZ1");
  }

  execmacro("internalZZ2");
:EndM
; ---------------------------------------
Macro:AX Absolute X
  execmacro("internalStatusAbsX");
:EndM
; ---------------------------------------
Macro:AZ1 Absolute Z1
  execmacro("internalStatusAbsZ1");
:EndM
; ---------------------------------------
Macro:AZ2 Absolute Z2
  execmacro("internalStatusAbsZ2");
:EndM
; ---------------------------------------
Macro:AA Absolute all (X,Z1,Z2)
  execmacro("internalStatusAbsX");
  execmacro("internalStatusAbsZ1");
  execmacro("internalStatusAbsZ2");
:EndM
; ---------------------------------------
Macro:CR Compound Rotation
  fvar count;

  if (input("Rotate Compound", "angle (CCW is +):", CompoundAngle)) {
    count = 1;
    if (CompoundAngle != 0) {
      while (count < 4) {
	display("Status", count, 4, "CR active");
	count = count + 1;
      }
    }
    else {
      while (count < 4) {
	display("Status", count, 4, "");
	count = count + 1;
      }
    }
  }
:EndM
; ---------------------------------------
Macro:RX Relative X
  execmacro("internalStatusRelX");
:EndM
; ---------------------------------------
Macro:RZ1 Relative Z1
  execmacro("internalStatusRelZ1");
:EndM
; ---------------------------------------
Macro:RZ2 Relative Z2
  execmacro("internalStatusRelZ2");
:EndM
; ---------------------------------------
Macro:RA Relative all (X,Z1,Z2)
  execmacro("internalStatusRelX");
  execmacro("internalStatusRelZ1");
  execmacro("internalStatusRelZ2");
:EndM
; ---------------------------------------
Macro:OX Offset X (radius/diameter) by value (abs/rel)
  fvar oxOffs;

  if (input("Offset X by value", "offset:", oxOffs)) {
    oxOffs = oxOffs / UnitScaling / DiamRadius;

    if (ModeXRelative > 0) {
      OffsetX = OffsetX + oxOffs;
    }
    else {
      ShdwOffs0 = ShdwOffs0 + oxOffs;
    }
  }
:EndM
; ---------------------------------------
Macro:OZ1 Offset Z1 (or Z) by value (abs/rel)
  fvar oz1Offs;

  if (input("Offset Z1 by value", "offset:", oz1Offs)) {
    if (TGMoveZ > 0) {
      TGLastZ = -9999999999;
    }
    else {
      TGLastZ = 99999999;
    }

    oz1Offs = oz1Offs / UnitScaling;

    if (ModeZ1Relative > 0) {
      OffsetZ1 = OffsetZ1 + oz1Offs;
    }
    else {
      ShdwOffs1 = ShdwOffs1 + oz1Offs;
    }
    oz1Offs = oz1Offs * UnitScaling; // back to original value if macro is called again
  }
:EndM
; ---------------------------------------
Macro:OZ2 Offset Z2 by value (abs/rel)
  fvar oz2Offs;

  if (input("Offset Z2 by value", "offset:", oz2Offs)) {
    if (TGMoveZ > 0) {
      TGLastZ = -9999999999;
    }
    else {
      TGLastZ = 99999999;
    }

    oz2Offs = oz2Offs / UnitScaling;

    if (ModeZ2Relative > 0) {
      OffsetZ2 = OffsetZ2 + oz2Offs;
    }
    else {
      ShdwOffs2 = ShdwOffs2 + oz2Offs;
    }

    oz2Offs = oz2Offs * UnitScaling;
  }
:EndM
; ---------------------------------------
Macro:PX Preset X (radius/diameter) (abs/rel)
  fvar px;

  if (input("Preset X with value", "value:", px)) {
    execmacro("internalZX");  // makes calucation easier
    px = px / UnitScaling / DiamRadius;

    if (ModeXRelative > 0) {
      OffsetX = OffsetX + px;
    }
    else {
      ShdwOffs0 = ShdwOffs0 + px;
    }

    px = px * UnitScaling * DiamRadius;

  }
:EndM
; ---------------------------------------
Macro:PZ1 Preset Z1 (or Z) (abs/rel)
  fvar pz1;

  if (input("Preset Z1 with value", "value:", pz1)) {
    execmacro("internalZZ1");
    pz1 = pz1 / UnitScaling;

    if (ModeZ1Relative > 0) {
      OffsetZ1 = OffsetZ1 + pz1;
    }
    else {
      ShdwOffs1 = ShdwOffs1 + pz1;
    }
    pz1 = pz1 * UnitScaling;
  }
:EndM
; ---------------------------------------
Macro:PZ2 Preset Z2 (abs/rel)
  fvar pz2;

  if (input("Preset Z2 with value", "value:", pz2)) {
    execmacro("internalZZ2");

    pz2 = pz2 / UnitScaling;
    if (ModeZ2Relative > 0) {
      OffsetZ2 = OffsetZ2 + pz2;
    }
    else {
      ShdwOffs2 = ShdwOffs2 + pz2;
    }
    pz2 = pz2 * UnitScaling;
  }
:EndM
; ---------------------------------------
Macro:-X Change sign X
  SignX = -SignX;

  if (SignX < 0) {
    display("Status", 1, 3, "NEG");
  }
  else {
    display("Status", 1, 3, "");
  }
:Endm
; ---------------------------------------
Macro:-Z1 Change sign Z1
  SignZ1 = - SignZ1;

  if (SignZ1 < 0) {
    display("Status", 2, 3, "NEG");
  }
  else {
    display("Status", 2, 3, "");
  }
:Endm
; ---------------------------------------
Macro:-Z2 Change sign Z2
  SignZ2 = - SignZ2;

  if (SignZ2 < 0) {
    display("Status", 3, 3, "NEG");
  }
  else {
    display("Status", 3, 3, "");
  }
:Endm
; ---------------------------------------
Macro:ARV Approx. Radius concaVe (Center of radius == center of tool tip radius)
  fvar ACVTargetRadius, ACVSteps;
  fvar ACVStartAngle, ACVStopAngle, ACVAngle;
  fvar ACVCenterX, ACVCenterZ;
  fvar ACVCenterXTmp, AVCCenterZTmp; // scratch
  fvar ACVXSave, ACVZSave;           // initial value
  fvar ACVSumZState;

  if (ACVStartAngle == 0.0) {
    ACVStartAngle = 90;
  }
  if (ACVStopAngle == 0.0) {
    ACVStopAngle = 180.0;
  }

  ACVCenterX = Disp1;
  ACVCenterZ = Disp2;
  if (ZSumActive == 0) {
    ACVCenterZ = ACVCenterZ + Disp3;
    ACVSumZState = 1; // remember that state, we switch mode (Z1 + Z2)
  }

  if (input("concave Radius",
	  "Tool tip radius:", TTR,
	   "Desired radius:", ACVTargetRadius,
	   "Starting angle:", ACVStartAngle,
	     "Ending angle:", ACVStopAngle,
       "Center of radius X:", ACVCenterX,
       "Center of radius Z:", ACVCenterZ,
	  "Number of steps:", ACVSteps)) {

    if (ACVTargetRadius < TTR) {
      input("Can't make that radius with this tool!");
    }
    else {
      // save current state for restauration
      ACVXSave = OffsetX;
      ACVZSave = OffsetZ1;

      execmacro("internalDZS");
      execmacro("internalStatusAbsSave");
      execmacro("internalStatusRelX");
      execmacro("internalStatusRelZ1");


      ACVAngle = ACVStartAngle;
      while (ACVAngle <= ACVStopAngle) {
	OffsetX =  sin(ACVAngle) * (ACVTargetRadius);
	OffsetZ1 = -cos(ACVAngle) * (ACVTargetRadius) + TTR;

	if (!getnext("Move to X/Z == 0.0")) { break; }

	ACVAngle = ACVAngle + (ACVStopAngle - ACVStartAngle) / ACVSteps;
      }

      // restore initial values
      OffsetX = ACVXSave;
      OffsetZ1 = ACVZSave;
      execmacro("internalStatusAbsRestore");

      if (ACVSumZState == 1.0) {
	execmacro("internalDZP");
      }
    }
  }
:Endm
; ---------------------------------------
; ***************************************
; *** Tool Geometry                   ***
; ***************************************
Macro:internalTGHandler

  // ---- detect change of units
  if (TGUnitScaling != UnitScaling) {
    input("Can't change units while TGC is active! Switching unit back.");
    if (TGUnitScaling == 1) {
      execmacro("internalMetric");
    }
    else {
      execmacro("internalInch");
    }
  }

  // ---- Z-axis
  if (Disp2 - TGLastZ >= TGSnap) {  // moving in pos. direction
    TGLastZ = Disp2;
    TGMoveZ = TGW;
    display("Status", 2, 5, "TGC +");
  }

  if (TGLastZ - Disp2 >= TGSnap) {   // moving in neg. direction
    TGLastZ = Disp2;
    TGMoveZ = 0.0;
    display("Status", 2, 5, "TGC -");
  }

  Disp1 = Disp1 + TGX * DiamRadius;
  Disp2 = Disp2 + TGMoveZ - TGZ;
:Endm
; ---------------------------------------
Macro:internalToolGeometryReadSnap
  if (intStatusUnit == 0) { // metric
    persread(TGSnap, "ToolGeometrySnapMetric");
  }
  else {
    persread(TGSnap, "ToolGeometrySnapInch");
  }
:EndM
; ---------------------------------------
Macro:internalToolGeometryGetSnap
  execmacro("internalToolGeometryReadSnap");

  while (TGSnap <= 0) {
    input("Tool geometry snap must be > 0.0");
    execmacro("internalForcedConfig");

    execmacro("internalToolGeometryReadSnap");
  }
:EndM
; ---------------------------------------
Macro:internalToolGeometry
  fvar TGUnitScaling;

  execmacro("internalDZS");  // no other way. Read: the other solution would be very complicated
  TGUnitScaling = UnitScaling; // detect change of units while TGC is active

  execmacro("internalToolGeometryGetSnap");

  // remove if it was already running (is still running)
  display("removePreDispHandler", "internalTGHandler");

  // ---- if we change tools, the Disp2 still has the offset.
  //      We need to substract it
  TGLastZ = Disp2 - TGMoveZ;

  TGMoveZ = 0;  // need to reinit
  display("Status", 1, 5, "TGC"); // show that snap has not yet detected
  display("Status", 2, 5, "TGC ?"); // the side we are cutting at

  display("addPreDispHandler", "internalTGHandler");
:Endm
; ---------------------------------------
Macro:TGC Tool Geometry Correction
  fvar TGZ, TTR, TGW, TGX, TGSnap;

  execmacro("internalToolGeometryGetSnap");

  if (input("Tool Geometry Correction",
		    "X-offset:", TGX,
		    "Z-offset:", TGZ,
		  "Tip radius:", TTZ,
		  "Tool width:", TGW,
		  "Snap-value:", TGSnap)) {

    perswrite(TGSnap);  // write back, it might be reread in internalToolGeometry
    execmacro("internalToolGeometry");
  }
:Endm
; ---------------------------------------
Macro:internalTGOFF
  display("removePreDispHandler", "internalTGHandler");

  TGMoveZ = 0;

  display("Status", 1, 5, "");
  display("Status", 2, 5, "");
:EndM
; ---------------------------------------
Macro:TGC- Switch off Tool Geometry correction
  execmacro("internalTGOFF");
:Endm
;----------------------------------------
Macro:internalCompoundCalc
  fvar scratch;

  scratch = (Dev2 * Dev2Scaling + (ShdwOffs2 + OffsetZ2 * ModeZ2Relative) * UnitScaling) * SignZ2;
  CompoundXPart = - sin(CompoundAngle) * scratch;
  CompoundZPart = cos(CompoundAngle) * scratch;
:EndM
;----------------------------------------
; ***********************************************************************
; *** Setup/Configuration of DRO:ddisp                                ***
; ***********************************************************************
Interp:
  fvar Dev0ScalingMetric, Dev0ScalingInch;
  fvar Dev1ScalingMetric, Dev1ScalingInch;
  fvar Dev2ScalingMetric, Dev2ScalingInch;

  fvar PrecisionMetric, PrecisionInch;
  fvar OffsetX, OffsetZ1, OffsetZ2;
  fvar ShdwOffs0, ShdwOffs1, ShdwOffs2;
  fvar SignX, SignZ1, SignZ2;
  fvar Dev0Scaling, Dev1Scaling, Dev2Scaling;
  fvar UnitScaling;
  fvar DiamRadius;
  fvar CompoundAngle;
  fvar CompoundXPart, CompoundZPart;

:endI
; the following file lscaling.inc is generated by the setup-program
INCLUDE:lscaling.inc
Interp:
  persfile("lpersist.tbl");

  PrecisionMetric = 2;  // resolution is 0.01mm
  PrecisionInch = 3;    // resolution is 0.001"

  SignX  = 1;
  SignZ1 = 1;
  SignZ2 = 1;
  UnitScaling = 1;

//display("AxName", 1, "X");
  display("AxName", 2, "Z/1");
  display("AxName", 3, "Z/2");
  display("AxSecName", 1, "X (abs, radius)");
  display("AxSecName", 2, "Z1 (abs)");
  display("AxSecName", 3, "Z2 (abs)");

  display("AxName",    4, "Comp. travel");
  display("AxSecName", 4, "Comp. angle ");

  persread(DiamRadius, "DiameterRadius");
  if (DiamRadius == 0) {
    DiamRadius = 2.0;  // display diameter as default
  }

  if (DiamRadius == 1.0) {
    execmacro("internalRadius");
  }
  else {
    execmacro("internalDiameter");
  }
  persread(intStatusUnit, "lastUnitSelection");
  persread(AVGThresholdMetric, "AVGFilterThresholdMetric");
  if (AVGThresholdMetric == 0) {
    AVGThresholdMetric = 0.02;
    perswrite(AVGThresholdMetric);
  }

  persread(AVGThresholdInch,   "AVGFilterThresholdInch");
  if (AVGThresholdInch == 0) {
    AVGThresholdInch = 0.005;
    perswrite(AVGThresholdInch);
  }

  if (intStatusUnit == 0) {
    execmacro("internalMetric"); // switch to metric and config AVG-buffer
  }
  else {
    execmacro("internalInch");
  }

  display("addPreDispHandler", "internalCompoundCalc"); // we do the math for a rotated compund here

  display("Source", 1, "(Dev0 * Dev0Scaling + (ShdwOffs0 + OffsetX  * ModeXRelative)  * UnitScaling) * SignX * DiamRadius + CompoundXPart * DiamRadius");
  display("Source", 2, "(Dev1 * Dev1Scaling + (ShdwOffs1 + OffsetZ1 * ModeZ1Relative) * UnitScaling) * SignZ1");
  display("Source", 3, "CompoundZPart");

  display("SecSource", 1, "Dev0 * Dev0Scaling + ShdwOffs0 * UnitScaling");
  display("SecSource", 2, "Dev1 * Dev1Scaling + ShdwOffs1 * UnitScaling");
  display("SecSource", 3, "Dev2 * Dev2Scaling + ShdwOffs2 * UnitScaling");

  display("Source",    4, "(Dev2 * Dev2Scaling + (ShdwOffs2 + OffsetZ2 * ModeZ2Relative) * UnitScaling) * SignZ2");
  display("SecSource", 4, "CompoundAngle");

  persread(ZSumActive, "ZSumActive");
  if (ZSumActive > 0) {
    execmacro("internalDZS");
  }

  execmacro("internalStatusAbsX");
  execmacro("internalStatusAbsZ1");
  execmacro("internalStatusAbsZ2");


  if (input("Initialize Devices?")) {
    if (input("Hardware-Zero devices?")) {
      execmacro("internalHZA");
    }
    if (input("Switch to FT-Mode?")) {
      execmacro("internalFTA");
    }
  }
:endI


